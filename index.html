<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <title>Read Tracker – kto przeczyta więcej stron?</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Read Tracker – kto przeczyta więcej stron?</h1>

  <!-- Login modal -->
  <div id="login-modal" class="modal">
    <div class="modal-content">
      <h2>Zaloguj się</h2>
      <p>Aby dodawać strony, musisz się zalogować.</p>
      <button id="google-login-btn" type="button">Zaloguj przez Google</button>
    </div>
  </div>

  <!-- User info / Logout -->
  <div id="user-info" style="display:none; margin-bottom: 20px; text-align: right;">
    <span id="display-name" style="margin-right: 10px; font-weight: bold;"></span>
    <button id="logout-btn" type="button">Wyloguj</button>
  </div>

  <form id="read-form">
    <label>
      Liczba stron:
      <input type="number" id="pages" min="1" required />
    </label>
    <label>
      Mnożnik:
      <select id="multiplier">
        <option value="1">1x</option>
        <option value="1.5">1.5x Angielski</option>
        <option value="1.5">1.5x Naukowa</option>
        <option value="2">2x Inne</option>
      </select>
    </label>
    <button type="submit">Dodaj</button>
  </form>
  <div id="error-message" style="display:none;color:red;"></div>

  <h2>Leaderboard</h2>
  <table id="leaderboard">
    <thead>
      <tr>
        <th>Imię</th>
        <th>Punkty (strony × mnożnik)</th>
      </tr>
    </thead>
    <tbody id="leaderboard-body"></tbody>
  </table>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="app.js"></script>
</body>
</html>
